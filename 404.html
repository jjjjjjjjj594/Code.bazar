<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Nahi Mili — CodeBazaar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
  :root{
    --ink:#14161f; --panel:#1c1f2b; --line:#2c3040; --text:#e8eaf2;
    --text-dim:#8288a0; --blue:#7aa2f7; --pink:#f7768e; --orange:#e0a458; --mint:#6fcf97;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--text); font-family:'Inter',sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{ text-align:center; max-width:440px; }
  .logo{
    font-family:'JetBrains Mono', monospace; font-weight:800; font-size:19px; display:flex;
    align-items:center; justify-content:center; gap:10px; margin-bottom:40px;
  }
  .logo img{ width:28px; height:28px; border-radius:8px; }
  .logo span{
    background:linear-gradient(90deg, var(--pink) 0%, var(--orange) 50%, var(--mint) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  }
  .code{
    font-family:'JetBrains Mono', monospace; font-size:80px; font-weight:700; line-height:1;
    background:linear-gradient(135deg, var(--pink), var(--orange));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    margin-bottom:18px;
  }
  h1{ font-size:20px; margin-bottom:10px; }
  p{ color:var(--text-dim); font-size:14.5px; margin-bottom:30px; line-height:1.6; }
  .btn{
    display:inline-block; background:var(--blue); color:#0a0b10; font-weight:700; font-size:14px;
    padding:12px 26px; border-radius:8px; text-decoration:none;
  }
  .btn:hover{ filter:brightness(1.08); }
  .terminal-line{
    font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--text-dim);
    background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
    margin-bottom:30px; text-align:left;
  }
  .terminal-line .prompt{ color:var(--mint); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="logo.svg" alt="CodeBazaar"><span>codebazaar</span></div>
  <div class="code">404</div>
  <h1>Yeh page nahi mila</h1>
  <div class="terminal-line"><span class="prompt">$</span> find . -name "requested-page" &rarr; not found</div>
  <p>Jo page aap dhoond rahe hain woh move ho gaya, delete ho gaya, ya kabhi tha hi nahi. Chalo wapas listings par chalte hain.</p>
  <a href="index.html" class="btn">Home par jao</a>
</div>
</body>
</html>
